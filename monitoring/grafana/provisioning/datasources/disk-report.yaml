apiVersion: 1
# remove the entry from before the rename so the uid can be reused
deleteDatasources:
  - name: Prometheus (disk report)
    orgId: 1
  - name: Prometheus (storage, kept forever)
    orgId: 1
datasources:
  - name: Prometheus
    uid: disk-report-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9091
    editable: false
  # full storage history from disk-report (never expires), used by the Storage dashboard
  - name: Storage history
    uid: storage-history
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    jsonData:
      allowedHosts:
        - http://disk-report:9105
