global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cadvisor'
    scrape_interval: 30s # matches cAdvisor housekeeping_interval
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # drop high-cardinality metrics nobody graphs
      - source_labels: [__name__]
        regex: 'container_(tasks_state|memory_failures_total|blkio_.*|fs_.*)'
        action: drop
      # keep only real containers (cgroups without a name are noise)
      - source_labels: [name]
        regex: '.+'
        action: keep

  - job_name: 'disk-report'
    scrape_interval: 60s
    static_configs:
      - targets: ['disk-report:9105']

  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'server'
