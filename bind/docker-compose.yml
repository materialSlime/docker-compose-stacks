services:
  bind-dns:
    image: ubuntu/bind9:latest
    container_name: bind-dns
    user: root  # <--- Forces the container to run as root
    restart: unless-stopped
    environment:
      - BIND9_USER=root
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ${PATH_TO_SERVICE_VOLUMES}/bind-dns/config:/etc/bind:z
      - ${PATH_TO_SERVICE_VOLUMES}/bind-dns/records:/var/lib/bind:z
      - ${PATH_TO_SERVICE_VOLUMES}/bind-dns/cache:/var/cache/bind:z
