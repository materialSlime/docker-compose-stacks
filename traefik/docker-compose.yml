name: traefik
services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - label=disable # SELinux: lets the container read docker.sock
      - no-new-privileges:true
    # No host ports: Traefik has its own LAN IP (TRAEFIK_IP) on the macvlan,
    # so it listens on 80/443 there and httpd keeps the host's 80/443.
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      traefik: {} # talks to arr/monitoring/portainer here
      direct-ip-macvlan:
        ipv4_address: ${TRAEFIK_IP:?TRAEFIK_IP is not set in .env}
    labels:
      - "traefik.enable=true"
      # Dashboard at http://traefik.<INTERNAL_DOMAIN>, LAN clients only
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=lan-only"
      - "traefik.http.middlewares.lan-only.ipallowlist.sourcerange=${LAN_SUBNET}"

networks:
  traefik:
    external: true
  direct-ip-macvlan:
    external: true
